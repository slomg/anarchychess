services:
    postgres:
        image: postgres
        ports:
            - 5432:5432
        volumes:
            - postgres_data:/var/lib/postgres/data
        restart: unless-stopped
        environment:
            POSTGRES_PASSWORD: "postgres"

    redis:
        image: redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data

    azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        restart: unless-stopped
        ports:
            - "10000:10000"
            - "10001:10001"
            - "10002:10002"
        volumes:
            - azurite_data:/data

    eventhubs-emulator:
        image: "mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest"
        restart: unless-stopped
        volumes:
            - "./eventshub-config.json:/Eventhubs_Emulator/ConfigFiles/Config.json"
            - eventshub_data:/Data
        ports:
            - "5672:5672"
            - "9092:9092"
            - "5300:5300"
        environment:
            ACCEPT_EULA: "Y"
            BLOB_SERVER: azurite
            METADATA_SERVER: azurite
            AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFe6kVZk3+0h1t9SQGphf65SlPfuFU=;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
        depends_on:
            - azurite

    anarchybot:
        image: slomg/anarchybot:latest
        restart: unless-stopped
        ports:
            - "6969:6969"

volumes:
    postgres_data:
    redis_data:
    azurite_data:
    eventshub_data:

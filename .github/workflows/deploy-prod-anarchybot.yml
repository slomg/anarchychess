name: Deploy Prod AnarchyBot

on:
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout to the branch
              uses: actions/checkout@v6

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push container image to registry
              run: |
                  IMAGE=${{ secrets.DOCKER_USERNAME }}/anarchybot

                  docker build --file backend/AnarchyChess.Ai.Service/Dockerfile backend --tag $IMAGE:${{ github.sha }} --tag $IMAGE:latest
                  docker push $IMAGE:${{ github.sha }}
                  docker push $IMAGE:latest

            - name: Deploy to Azure VM
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.ANARCHYBOT_AZURE_VM_HOST }}
                  username: ${{ secrets.ANARCHYBOT_AZURE_VM_USER }}
                  key: ${{ secrets.ANARCHYBOT_AZURE_VM_SSH_KEY }}
                  script: |
                      docker pull ${{ secrets.DOCKER_USERNAME }}/anarchybot:${{ github.sha }}
                      docker stop anarchybot || true
                      docker rm anarchybot || true
                      docker run -d --name anarchybot -p 6969:6969 --restart unless-stopped ${{ secrets.DOCKER_USERNAME }}/anarchybot:${{ github.sha }}

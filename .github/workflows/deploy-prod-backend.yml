name: Deploy Prod Backend

on:
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout to the branch
              uses: actions/checkout@v6.0.2

            - name: Azure Login
              uses: azure/login@v3.0.0
              with:
                  client-id: ${{ secrets.ANARCHYCHESS_AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Build and push container image to registry
              uses: azure/container-apps-deploy-action@v2
              with:
                  appSourcePath: ${{ github.workspace }}/backend
                  dockerfilePath: AnarchyChess.Api/Dockerfile
                  registryUrl: docker.io
                  registryUsername: ${{ secrets.DOCKER_USERNAME }}
                  registryPassword: ${{ secrets.DOCKER_PASSWORD }}
                  containerAppName: anarchychess-prod-containerapp
                  resourceGroup: anarchychess-prod-resource
                  imageToBuild: slomg/anarchychess-api:${{ github.sha }}
